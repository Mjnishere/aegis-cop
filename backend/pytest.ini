[pytest]
# Only the maintained suite. backend/test_*.py and scripts/test_*.py are legacy
# scripts (some call a live server at import time) and must not be collected.
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider -ra --strict-markers
markers =
    requires_graph: needs the OSM road graph (OSM_GRAPH_PATH); skipped when absent
    requires_dem: needs the CartoDEM GeoTIFF (DEM_PATH); skipped when absent
    network: makes real outbound network calls; skipped unless --run-network
filterwarnings =
    # Known debt: v1-style Pydantic API and naive UTC timestamps (see docs/project/IMPLEMENTATION_STATUS.md)
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:datetime.datetime.utcnow:DeprecationWarning
